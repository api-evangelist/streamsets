aid: streamsets
name: StreamSets
description: StreamSets, now part of IBM, is a DataOps platform for building, running, and operating smart data
  pipelines for streaming, batch, and change-data-capture workloads across hybrid and multi-cloud environments.
  Its flagship products — Control Hub (the cloud-native control plane), Data Collector, and Transformer — let data
  engineers design pipelines once and run them anywhere, with drift detection that keeps pipelines resilient as
  schemas and infrastructure change. StreamSets exposes a Control Hub REST API and an official Python SDK so teams
  can automate pipeline design, deployment, job orchestration, and monitoring as code. Originally founded in 2014
  and backed by Battery Ventures and DCVC, StreamSets was acquired by Software AG and is now delivered as IBM StreamSets.
